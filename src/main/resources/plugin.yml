name: EmeraldSMP
version: '1.5'
main: net.emeraldsmp.EmeraldSMP
api-version: '1.21'
description: Emerald SMP economy, teams, tags, roles, kits, custom spawners, drills, worth, shop, RTP, orders, coin flips, auction house and homes
commands:
  emerald:
    description: Emerald SMP foundation command
    usage: /emerald [reload]
    permission: emerald.command
  balance:
    description: Shows your Money balance
    usage: /balance [player]
    aliases: [bal, money]
    permission: emerald.command
  pay:
    description: Pay another online player
    usage: /pay <player> <amount>
    permission: emerald.command
  eco:
    description: Emerald economy administration
    usage: /eco <give|take|set|reset> <player> [amount]
    permission: emerald.admin
  shop:
    description: Opens the Emerald SMP shop
    usage: /shop
    permission: emerald.command
  sell:
    description: Opens the Emerald SMP sell menu
    usage: /sell
    permission: emerald.command
  worth:
    description: Opens the Emerald SMP item worth browser
    usage: /worth [search]
    permission: emerald.command
  rtp:
    description: Teleports you to a random safe location
    usage: /rtp
    permission: emerald.command
  order:
    description: Opens player-to-player item orders
    usage: /order
    permission: emerald.command
  cf:
    description: Opens coin flip
    usage: /cf
    permission: emerald.command
  ah:
    description: Opens the Auction House
    usage: /ah [sell]
    permission: emerald.command
  sethome:
    description: Save your current location as a home
    usage: /sethome [name]
    permission: emerald.command
  home:
    description: Open your homes or teleport to a named home
    usage: /home [name]
    permission: emerald.command
  delhome:
    description: Delete a saved home
    usage: /delhome <name>
    permission: emerald.command
  afk:
    description: Toggle AFK status
    usage: /afk
    permission: emerald.command
  teams:
    description: Opens the Emerald SMP team GUI
    usage: /teams
    aliases: [team]
    permission: emerald.command
  tags:
    description: Opens cosmetic tags
    usage: /tags
    permission: emerald.command
  spawner:
    description: Emerald SMP custom spawner administration
    usage: /spawner give <player> skeleton [amount]
    permission: emerald.admin
  drill:
    description: Gives the Original Drill (admin only)
    usage: /drill [player]
    permission: emerald.admin
  shardgainer:
    description: Gives an Emerald Gainer (admin only)
    usage: /shardgainer [player]
    permission: emerald.admin
  crates:
    description: Opens Emerald SMP crate information or manages crates
    usage: /crates [give|place|remove|edit]
    permission: emerald.command
  crate:
    description: Crate management alias
    usage: /crate edit <type>
    permission: emerald.admin
  keyall:
    description: Gives a crate key to all online players
    usage: /keyall <type> [amount]
    permission: emerald.admin
  roles:
    description: OP-only Emerald SMP role management
    usage: /roles [set <player> <role>]
    permission: emerald.roles
  kits:
    description: Opens the Emerald SMP kit menu
    usage: /kits
    permission: emerald.command
permissions:
  emerald.command:
    description: Allows use of Emerald SMP commands
    default: true
  emerald.admin:
    description: Allows administrative commands
    default: op
    children:
      emerald.command: true
  emerald.roles:
    description: Role management; OP-only in command and GUI
    default: op
  emerald.rtp.bypass:
    description: Bypasses the /rtp cooldown
    default: op
  emerald.owner:
    description: Legacy visual permission; roles now use Emerald role data
    default: false
  emerald.dev:
    description: Legacy visual permission; roles now use Emerald role data
    default: false
  emerald.mod:
    description: Legacy visual permission; roles now use Emerald role data
    default: false
  emerald.media:
    description: Legacy visual permission; roles now use Emerald role data
    default: false
