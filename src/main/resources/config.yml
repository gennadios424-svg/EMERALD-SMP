server:
  name: "Emerald SMP"

afk:
  enabled: true
  auto-afk-minutes: 10
  show-in-tab: true

economy:
  starting-balance: 0
  currency-symbol: "$"
  # /sell payout = Worth value × this multiplier. 0.50 = 50%.
  sell-multiplier: 0.50

visual:
  primary-color: "GREEN"
  secondary-color: "DARK_GREEN"
  accent-color: "LIME"

messages:
  prefix: "&a💚 &2&lEmerald SMP &8»"
  rtp:
    searching: "&7Finding a safe random location..."\n    countdown: "&aTeleporting in &f%time%&a..."\n    cancelled: "&cRTP cancelled because you moved."
    success: "&aRTP complete! You have been safely teleported."
    cooldown: "&cYou must wait &f%time%&c before using RTP again."
    failed: "&cCould not find a safe RTP location. Please try again."
    not-allowed: "&cRTP is not allowed in this world."
    homes:
      countdown: "&aTeleporting to &f%home% &ain &f%time%&a..."

