# /rtp settings.
# Add world names to the list to allow RTP in those worlds.
# Empty worlds list = RTP is allowed in every loaded world.
rtp:
  countdown: 5
  min-distance: 500
  max-distance: 5000
  cooldown: 60
  worlds:
    - world
    - world_nether
    - world_the_end


# /homes settings.
homes:
  max: 3
  teleport-countdown: 3

# Custom Emerald SMP spawners.
spawners:
  skeleton:
    amount: 8
    interval-seconds: 12


# Custom Emerald SMP drill progression. These values are configurable.
drills:
  blocks-per-level: 100
  tiers:
    1:
      efficiency: 1
      shards-per-level: 5
    2:
      efficiency: 2
      shards-per-level: 6
    3:
      efficiency: 3
      shards-per-level: 7
    4:
      efficiency: 4
      shards-per-level: 8
    5:
      efficiency: 5
      shards-per-level: 10
