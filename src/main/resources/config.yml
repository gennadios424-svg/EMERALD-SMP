server:
  name: "Emerald SMP"
afk:
  enabled: true
  auto-afk-minutes: 10
  show-in-tab: true
economy:
  starting-balance: 0
  currency-symbol: "$"
  sell-multiplier: 1.0
visual:
  primary-color: "GREEN"
  secondary-color: "DARK_GREEN"
  accent-color: "LIME"
messages:
  prefix: "&a💚 &2&lEmerald SMP &8»"
rtp:
  countdown: 5
  min-distance: 500
  max-distance: 5000
  cooldown: 60
  worlds: [world, world_nether, world_the_end]
homes:
  max: 3
  teleport-countdown: 3
spawners:
  skeleton:
    amount: 8
    interval-seconds: 12
emerald-miner:
  expiration-days: 7
  xp-per-block: 1
  blocks-per-level: 100
  levels-per-tier: 10
  gainer:
    min-blocks: 1
    max-blocks: 32
    min-shards: 1
    max-shards: 5
lag-cleaner:
  enabled: true
  interval-minutes: 5
  clear-dropped-items: true
  announce: true
shop:
  buy-multiplier: 2.5
kits:
  member:
    role: MEMBER
    cooldown: 24h
    items:
      - "BREAD:16"
      - "IRON_INGOT:8"
  vip:
    role: VIP
    cooldown: 24h
    items:
      - "BREAD:24"
      - "IRON_INGOT:16"
      - "GOLD_INGOT:4"
  mvp:
    role: MVP
    cooldown: 24h
    items:
      - "GOLDEN_APPLE:1"
      - "DIAMOND:4"
      - "GOLD_INGOT:16"
  emerald:
    role: EMERALD
    cooldown: 24h
    items:
      - "DIAMOND:8"
      - "EMERALD:8"
      - "GOLDEN_APPLE:2"
  media:
    role: MEDIA
    cooldown: 24h
    items:
      - "DIAMOND:10"
      - "EMERALD:10"
      - "GOLDEN_APPLE:2"
  mod:
    role: MOD
    cooldown: 24h
    items:
      - "DIAMOND:16"
      - "EMERALD:16"
      - "GOLDEN_APPLE:3"
  dev:
    role: DEV
    cooldown: 24h
    items:
      - "DIAMOND:24"
      - "EMERALD:24"
      - "GOLDEN_APPLE:4"
  owner:
    role: OWNER
    cooldown: 24h
    items:
      - "DIAMOND:32"
      - "EMERALD:32"
      - "GOLDEN_APPLE:5"
crates:
  animation:
    common: 35
    spawner: 45
    gold: 55
    crimson: 65
    emerald: 75
  rewards:
    common: []
    spawner: []
    gold: []
    crimson: []
    emerald: []
