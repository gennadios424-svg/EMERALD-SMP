server:
  name: "Emerald SMP"
afk:
  enabled: true
  auto-afk-minutes: 10
  show-in-tab: true
economy:
  starting-balance: 0
  currency-symbol: "$"
  sell-multiplier: 1.0
visual:
  primary-color: "GREEN"
  secondary-color: "DARK_GREEN"
  accent-color: "LIME"
messages:
  prefix: "&a💚 &2&lEmerald SMP &8»"
rtp:
  countdown: 5
  min-distance: 500
  max-distance: 5000
  cooldown: 60
  worlds: [world, world_nether, world_the_end]
homes:
  max: 3
  teleport-countdown: 3
spawners:
  skeleton:
    amount: 8
    interval-seconds: 12
emerald-miner:
  expiration-days: 7
  xp-per-block: 1
  blocks-per-level: 100
  levels-per-tier: 10
  gainer:
    min-blocks: 1
    max-blocks: 32
    min-shards: 1
    max-shards: 5
lag-cleaner:
  enabled: true
  interval-minutes: 5
  clear-dropped-items: true
  announce: true
shop:
  buy-multiplier: 2.5
crates:
  animation:
    common: 35
    spawner: 45
    gold: 55
    crimson: 65
    emerald: 75
  rewards:
    common:
      - "25|COAL:16"
      - "20|IRON_INGOT:8"
      - "15|GOLD_INGOT:6"
      - "10|DIAMOND:2"
      - "15|shards:2"
      - "15|$5000"
    spawner:
      - "25|BONE:64"
      - "20|ARROW:64"
      - "20|shards:5"
      - "20|$10000"
      - "15|DIAMOND:4"
    gold:
      - "20|GOLD_INGOT:32"
      - "20|DIAMOND:8"
      - "20|EMERALD:16"
      - "20|shards:10"
      - "20|$25000"
    crimson:
      - "20|DIAMOND:16"
      - "20|EMERALD:32"
      - "20|NETHERITE_SCRAP:4"
      - "20|shards:20"
      - "20|$50000"
    emerald:
      - "20|DIAMOND:32"
      - "20|EMERALD:64"
      - "20|NETHERITE_INGOT:2"
      - "20|shards:40"
      - "20|$100000"
