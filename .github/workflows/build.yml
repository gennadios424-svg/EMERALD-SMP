name: Build EmeraldSMP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldSMP-1.0
          path: target/EmeraldSMP-1.0.jar
