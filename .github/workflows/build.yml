name: Build EmeraldSMP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build EmeraldSMP
        run: mvn -B package

      - name: Download ViaVersion 5.12.0
        run: |
          mkdir -p server/plugins
          curl -fL --retry 3 \
            https://github.com/ViaVersion/ViaVersion/releases/download/5.12.0/ViaVersion-5.12.0.jar \
            -o server/plugins/ViaVersion-5.12.0.jar

      - name: Verify plugin artifacts
        run: |
          test -s target/EmeraldSMP-1.0.jar
          test -s server/plugins/ViaVersion-5.12.0.jar
          jar tf server/plugins/ViaVersion-5.12.0.jar >/dev/null
          echo "EmeraldSMP: OK"
          echo "ViaVersion: OK"

      - name: Upload EmeraldSMP plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldSMP-1.0
          path: target/EmeraldSMP-1.0.jar

      - name: Upload server plugins bundle
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldSMP-server-plugins
          path: server/plugins/
