name: Emerald SMP Final Build

on:
  push:
    paths:
      - "src/main/java/**"
      - "pom.xml"
      - ".github/workflows/final-build.yml"
      - "EmeraldSMP-1.0(20261002-205000) (1).jar"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare supplied JAR as base
        run: |
          set -euo pipefail
          rm -rf work final-classes
          mkdir -p work/base final-classes
          cp "EmeraldSMP-1.0(20261002-205000) (1).jar" work/base.jar
          cd work/base
          jar xf ../base.jar
          python3 - <<'PY'
          from pathlib import Path
          p=Path('net/emeraldsmp/EmeraldSMP.class')
          b=p.read_bytes()
          pos=10
          cp_count=int.from_bytes(b[8:10],'big')
          entries=[]
          i=1
          while i<cp_count:
              start=pos
              tag=b[pos]; pos+=1
              if tag==1:
                  ln=int.from_bytes(b[pos:pos+2],'big')
                  raw=b[pos+2:pos+2+ln].decode('utf-8')
                  pos+=2+ln
                  raw=raw.replace('net/emeraldsmp/EmeraldSMP','net/emeraldsmp/EmeraldSMPBase')
                  enc=raw.encode('utf-8')
                  entries.append(bytes([1])+len(enc).to_bytes(2,'big')+enc)
              elif tag in (3,4):
                  entries.append(b[start:start+5]); pos=start+5
              elif tag in (5,6):
                  entries.append(b[start:start+9]); pos=start+9; i+=1
              elif tag in (7,8,16,19,20):
                  entries.append(b[start:start+3]); pos=start+3
              elif tag in (9,10,11,12,17,18):
                  entries.append(b[start:start+5]); pos=start+5
              elif tag==15:
                  entries.append(b[start:start+4]); pos=start+4
              else:
                  raise SystemExit(f'unknown constant-pool tag {tag}')
              i+=1
          old_cp_end=pos
          rest=bytearray(b[old_cp_end:])
          flags=int.from_bytes(rest[0:2],'big')
          rest[0:2]=(flags & ~0x0010).to_bytes(2,'big')
          out=b[:8]+cp_count.to_bytes(2,'big')+b''.join(entries)+rest
          Path('net/emeraldsmp/EmeraldSMPBase.class').write_bytes(out)
          p.unlink()
          PY

      - name: Fetch Paper API
        run: mvn -q -DskipTests dependency:copy-dependencies -DincludeScope=provided -DoutputDirectory=deps

      - name: Compile restoration layer
        run: |
          set -euo pipefail
          CP="work/base:deps/paper-api-1.21.11-R0.1-SNAPSHOT.jar"
          javac --release 21 -cp "$CP" -d final-classes src/main/java/net/emeraldsmp/EmeraldSMP.java src/main/java/net/emeraldsmp/FinalRestorationPatch.java
          cp final-classes/net/emeraldsmp/EmeraldSMP.class work/base/net/emeraldsmp/EmeraldSMP.class
          cp final-classes/net/emeraldsmp/FinalRestorationPatch.class work/base/net/emeraldsmp/FinalRestorationPatch.class
          unzip -l final-classes/net/emeraldsmp/FinalRestorationPatch.class >/dev/null

      - name: Add final commands
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/base/plugin.yml')
          s=p.read_text()
          marker='permissions:\n'
          additions='''  role:
            description: Secure Emerald SMP role manager
            usage: /role <player> <role>
            permission: emerald.roles
          banlist:
            description: Opens the staff ban list GUI
            usage: /banlist
            permission: emerald.anticheat
          '''
          if '  role:\n' not in s:
              s=s.replace(marker, additions+marker)
          p.write_text(s)
          PY

      - name: Build final JAR
        run: |
          set -euo pipefail
          rm -f EmeraldSMP-1.0.jar
          (cd work/base && jar --create --file ../../EmeraldSMP-1.0.jar .)
          unzip -t EmeraldSMP-1.0.jar >/dev/null
          unzip -p EmeraldSMP-1.0.jar plugin.yml | grep -q 'main: net.emeraldsmp.EmeraldSMP'
          test -s EmeraldSMP-1.0.jar

      - name: Runtime test on Paper 1.21.11 / Java 21
        run: |
          set -euo pipefail
          VERSION=1.21.11
          BUILD=$(curl -fsSL "https://api.papermc.io/v2/projects/paper/versions/$VERSION" | python3 -c 'import json,sys; print(json.load(sys.stdin)["builds"][-1])')
          curl -fsSL -o paper.jar "https://api.papermc.io/v2/projects/paper/versions/$VERSION/builds/$BUILD/downloads/paper-$VERSION-$BUILD.jar"
          mkdir -p server/plugins
          cp EmeraldSMP-1.0.jar server/plugins/EmeraldSMP-1.0.jar
          printf 'eula=true\n' > server/eula.txt
          cd server
          timeout 120s java -Xms512M -Xmx1G -jar ../paper.jar --nogui > console.log 2>&1 || true
          cat console.log
          grep -Eq 'Enabling EmeraldSMP|EmeraldSMP.*enabled' console.log

      - name: Commit final JAR
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EmeraldSMP-1.0.jar FINAL-CHANGELOG.md
          git diff --cached --quiet || git commit -m "build: EmeraldSMP final restoration jar"
          git push
