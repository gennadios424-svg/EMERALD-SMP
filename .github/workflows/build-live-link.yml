name: Build Live Link Update
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build JAR
        run: mvn --batch-mode --update-snapshots clean package
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/build-live-link.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-live-link.yml
          git commit -m '[emerald-live] Build live link update'
          git push
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldSMP-live-link
          path: target/EmeraldSMP-1.0.jar
          retention-days: 7
