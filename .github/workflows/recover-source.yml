name: Recover Emerald SMP Source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backup
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download CFR decompiler
        run: curl -L --fail -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar

      - name: Extract and decompile backup
        run: |
          rm -rf recovered
          mkdir -p recovered/src/main/java recovered/src/main/resources
          cp "EmeraldSMP-1.0(20261002-205000) (1).jar" recovered/EmeraldSMP-backup.jar
          java -jar cfr.jar "EmeraldSMP-1.0(20261002-205000) (1).jar" --outputdir recovered/src/main/java --comments false --silent true
          cd recovered
          jar xf EmeraldSMP-backup.jar
          if [ -f plugin.yml ]; then cp plugin.yml src/main/resources/plugin.yml; fi
          if [ -f bungee.yml ]; then cp bungee.yml src/main/resources/bungee.yml; fi
          cat > settings.gradle <<'EOF'
rootProject.name = 'EmeraldSMP'
EOF
          cat > build.gradle <<'EOF'
plugins {
    id 'java'
}
group = 'net.emeraldsmp'
version = '1.0'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}
repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
EOF
          cat > RECOVERY-NOTES.md <<'EOF'
# Emerald SMP Source Recovery

This project was reconstructed from the last known working EmeraldSMP-1.0 backup JAR.

The Java files are decompiled source and should be reviewed before being treated as a clean original source tree. The original backup JAR is preserved unchanged as EmeraldSMP-backup.jar.

The restoration specification must be implemented without deleting existing working systems.
EOF

      - name: Commit recovered source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered
          git diff --cached --quiet && exit 0
          git commit -m "build: recover Emerald SMP source from working backup"
          git push

      - name: Upload recovered source artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldSMP-recovered-source
          path: recovered/
