name: Emerald SMP Clean Build
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Fix and build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/main/java/net/emeraldsmp/EmeraldSMP.java')
          s=p.read_text()
          s=re.sub(r'if\(tpaManager!=null\)tpaManager\.disable\(\);','',s)
          p.write_text(s)
          PY
          mvn --batch-mode --update-snapshots clean package
      - name: Commit source and remove temporary workflows
        run: |
          rm -f .github/workflows/emerald-clean-build.yml .github/workflows/emerald-integrate-final.yml .github/workflows/emerald-finalize.yml .github/workflows/emerald-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main .github/workflows/emerald-clean-build.yml .github/workflows/emerald-integrate-final.yml .github/workflows/emerald-finalize.yml .github/workflows/emerald-repair.yml
          git commit -m '[emerald-feature-update] Final Emerald SMP live spawner anticheat TPA build'
          git push
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldSMP-final-live-spawners-anticheat-tpa
          path: target/EmeraldSMP-1.0.jar
          retention-days: 7
