name: Emerald SMP Repair
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Repair and build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/net/emeraldsmp/EmeraldSMP.java')
          s=p.read_text()
          s=s.replace('if(tpaManager!=null)tpaManager.disable();','')
          p.write_text(s)
          PY
          mvn --batch-mode --update-snapshots clean package
      - name: Commit and remove temporary workflows
        run: |
          rm -f .github/workflows/emerald-repair.yml .github/workflows/emerald-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/net/emeraldsmp/EmeraldSMP.java .github/workflows/emerald-repair.yml .github/workflows/emerald-finalize.yml
          git commit -m '[emerald-feature-update] Finalize live spawner anticheat and TPA systems'
          git push
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldSMP-final-live-spawners-anticheat-tpa
          path: target/EmeraldSMP-1.0.jar
          retention-days: 7
