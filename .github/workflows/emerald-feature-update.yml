          s=s.replace('this.owner = owner;', 'this.owner = new UUID(0L, 0L);')
          s=s.replace('String ownerString = y.getString(p + ".owner");\n                if (ownerString == null) continue;', 'String ownerString = y.getString(p + ".owner", new UUID(0L, 0L).toString());')
          s=re.sub(r'private Data findAdjacentOwned\(Block b, UUID owner, String type\) \{.*?\n    \}', '''private Data findAdjacentOwned(Block b, UUID owner, String type) {\n        for (BlockFace face : List.of(BlockFace.NORTH, BlockFace.SOUTH, BlockFace.EAST, BlockFace.WEST)) {\n            Data d = spawners.get(key(b.getRelative(face)));\n            if (d != null && d.type.equals(type)) return d;\n        }\n        return null;\n    }''', s, flags=re.S)
          s=re.sub(r'private boolean canManage\(Player p, Data d\) \{.*?\n    \}', '''private boolean canManage(Player p, Data d) {\n        return true;\n    }''', s, count=1, flags=re.S)
          sp.write_text(s,encoding='utf-8')

          # Main plugin registration.
          main=root/'src/main/java/net/emeraldsmp/EmeraldSMP.java'
          s=main.read_text(encoding='utf-8')
          s=s.replace('import net.emeraldsmp.anticheat.SusListManager;', 'import net.emeraldsmp.anticheat.SusListManager;\nimport net.emeraldsmp.anticheat.MovementAntiCheat;\nimport net.emeraldsmp.live.LiveManager;')
          s=s.replace('private InvestmentManager investmentManager; private StaffCommand staffCommand; private SusListManager susListManager; private KeyAllManager keyAllManager; private TpaManager tpaManager; private CombatManager combatManager;', 'private InvestmentManager investmentManager; private StaffCommand staffCommand; private SusListManager susListManager; private KeyAllManager keyAllManager; private TpaManager tpaManager; private CombatManager combatManager; private LiveManager liveManager;')
          s=s.replace('register("suslist",susListCommand,susListCommand);', 'register("suslist",susListCommand,susListCommand);\n            liveManager=new LiveManager(this); register("live",liveManager,null); getServer().getPluginManager().registerEvents(liveManager,this);')
          s=s.replace('getServer().getPluginManager().registerEvents(new FlightAntiCheat(this,susListManager),this); getServer().getPluginManager().registerEvents(new MacroAntiCheat(this),this);', 'getServer().getPluginManager().registerEvents(new FlightAntiCheat(this,susListManager),this); getServer().getPluginManager().registerEvents(new MacroAntiCheat(this),this); getServer().getPluginManager().registerEvents(new MovementAntiCheat(this),this);')
          s=s.replace('public InvestmentManager getInvestmentManager(){return investmentManager;} public SusListManager getSusListManager(){return susListManager;} public KeyAllManager getKeyAllManager(){return keyAllManager;} public TpaManager getTpaManager(){return tpaManager;} public CombatManager getCombatManager(){return combatManager;}', 'public InvestmentManager getInvestmentManager(){return investmentManager;} public SusListManager getSusListManager(){return susListManager;} public KeyAllManager getKeyAllManager(){return keyAllManager;} public TpaManager getTpaManager(){return tpaManager;} public CombatManager getCombatManager(){return combatManager;} public LiveManager getLiveManager(){return liveManager;}')
          s=s.replace('if(investmentManager!=null)investmentManager.stop();', 'if(investmentManager!=null)investmentManager.stop(); if(liveManager!=null)liveManager.disable();')
          main.write_text(s,encoding='utf-8')

          # plugin.yml: register /live and keep access controlled in LiveManager by exact MEDIA role.
          py=root/'src/main/resources/plugin.yml'
          s=py.read_text(encoding='utf-8')
          marker='  tpa:\n    description: Request to teleport to another player\n    usage: /tpa <player>\n    permission: emerald.command\n'
          insert='  live:\n    description: Toggle Emerald SMP live status (MEDIA role only)\n    usage: /live\n    permission: emerald.command\n'
          if '  live:\n' not in s: s=s.replace(marker, marker+insert)
          py.write_text(s,encoding='utf-8')

          # Version bump only; no unrelated systems are changed.
          py.write_text(py.read_text(encoding='utf-8').replace("version: '1.7'", "version: '1.8'"), encoding='utf-8')

      - name: Build and verify
        run: mvn --batch-mode --update-snapshots clean package
      - name: Commit source changes and remove one-time updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .github/workflows/emerald-feature-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src pom.xml .github/workflows/emerald-feature-update.yml
          git commit -m "[emerald-feature-update] Add live spawners anticheat and TPA upgrade"
          git push
      - name: Stage JAR
        run: mkdir -p staging && cp target/EmeraldSMP-1.0.jar staging/EmeraldSMP-1.0.jar
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldSMP-live-spawners-anticheat-tpa
          path: staging/EmeraldSMP-1.0.jar
          retention-days: 7
