name: Emerald SMP Runtime Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "*.jar"
      - ".github/workflows/runtime-test.yml"

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Inspect base JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find . -maxdepth 1 -type f -name '*.jar' | head -n1)"
          test -n "$JAR"
          unzip -p "$JAR" plugin.yml > /tmp/plugin.yml
          cat /tmp/plugin.yml

      - name: Download Paper 1.21.11
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.21.11"
          BUILD="$(curl -fsSL "https://api.papermc.io/v2/projects/paper/versions/$VERSION" | python3 -c 'import json,sys; print(json.load(sys.stdin)["builds"][-1])')"
          curl -fsSL -o paper.jar "https://api.papermc.io/v2/projects/paper/versions/$VERSION/builds/$BUILD/downloads/paper-$VERSION-$BUILD.jar"

      - name: Start Paper and verify Emerald SMP enables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/plugins
          JAR="$(find . -maxdepth 1 -type f -name '*.jar' | head -n1)"
          cp "$JAR" server/plugins/EmeraldSMP-1.0.jar
          printf 'eula=true\n' > server/eula.txt
          cd server
          timeout 90s java -Xms512M -Xmx1G -jar ../paper.jar --nogui > console.log 2>&1 || true
          cat console.log
          if grep -Eq 'Enabling EmeraldSMP|EmeraldSMP.*enabled' console.log; then
            echo "Emerald SMP enabled successfully."
          else
            echo "Emerald SMP did not report successful enablement."
            exit 1
          fi
